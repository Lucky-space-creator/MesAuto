spring:
  application:
    name: mesCore
  profiles:
    active: dev

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://localhost:3306/mescore?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/init-data.sql
      continue-on-error: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-enums-package: com.lucky.mescore.common.enums
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: mescore

jwt:
  secret: mesCore2025SecretKeyForJwtTokenGenerationMustBeLongEnough
  expire-seconds: 7200

mes:
  # 上游ERP订单同步（模拟）
  erp-sync:
    # 定时同步开关，默认关闭；可通过 POST /api/erp/sync/order 手动触发
    enabled: false
    # 每次拉取的订单数
    batch-size: 3
    # 定时表达式，默认每5分钟
    cron: 0 */5 * * * ?

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
