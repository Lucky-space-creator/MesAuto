spring:
  datasource:
    druid:
      url: jdbc:mysql://prod-db:3306/mescore?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&useSSL=true&serverTimezone=Asia/Shanghai
      username: ${DB_USERNAME:}
      password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:}
      port: 6379
      password: ${REDIS_PASSWORD:}

minio:
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
